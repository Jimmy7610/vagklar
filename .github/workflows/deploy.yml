name: Bygg och publicera

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, typkontroll och tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typkontroll
        run: npm run typecheck

      - name: Tester
        run: npm test

  build:
    name: Bygg
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bygg
        # The base path must match where Pages serves the site. For a project
        # page that is /<repo>/; for a user or organisation page it is /.
        run: npm run build
        env:
          VAGKLAR_BASE: /${{ github.event.repository.name }}/

      # 'npm run build' already runs this, but asserting it here too means the
      # published artifact is checked immediately before upload — no licensed
      # source document can reach GitHub Pages.
      - name: Kontrollera bygget (inga källdokument, appskal på plats)
        run: npm run verify:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicera
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
